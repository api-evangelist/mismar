aid: mismar
name: MisMar
description: >-
  MisMar (مسمار) is a Saudi Arabian automotive maintenance and repair platform
  that connects vehicle owners with certified service centers. It runs a
  consumer mobile app (B2C) alongside a Network-as-a-Service (NaaS) platform and
  Workshop Management System (WMS) that digitize fleet management, order
  processing, and workshop operations for business (B2B), government (B2G), and
  insurance partners. Services span fault diagnostics, accident restoration, oil
  and battery and tire changes, periodic maintenance, car wash, and protective
  treatments across 45+ Saudi cities, with at-home or center-based delivery and
  warranty coverage. MisMar is a portfolio company of 500 Global. No public
  developer API, OpenAPI, or SDK surface is currently published.
